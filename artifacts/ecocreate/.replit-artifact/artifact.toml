kind = "web"
previewPath = "/"
title = "EcoCreate"
version = "1.0.0"
id = "artifacts/ecocreate"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23801

[services.development]
run = "pnpm --filter @workspace/ecocreate run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecocreate", "run", "build" ]
publicDir = "artifacts/ecocreate/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23801"
BASE_PATH = "/"
